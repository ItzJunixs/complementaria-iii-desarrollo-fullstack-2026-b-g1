spring.application.name=veterinaria-api
server.port=8080

# Base de datos H2 en memoria (se reinicia cada vez que se levanta la app)
spring.datasource.url=jdbc:h2:mem:veterinaria
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:veterinaria)
spring.h2.console.enabled=true

# JPA crea la tabla a partir de la entity
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Cargar data.sql despues de que Hibernate cree las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.encoding=UTF-8

# Swagger / OpenAPI (springdoc)
# Interfaz: http://localhost:8080/swagger-ui.html  |  JSON: http://localhost:8080/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
