spring.application.name=biblioteca-api
server.port=8080

# Base de datos H2 en memoria (se reinicia al reiniciar la app)
spring.datasource.url=jdbc:h2:mem:biblioteca
spring.datasource.username=sa
spring.datasource.password=

# Consola H2: http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:biblioteca)
spring.h2.console.enabled=true

# JPA crea la tabla a partir de la entity Libro
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# data.sql se ejecuta despues de crear las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.encoding=UTF-8

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
